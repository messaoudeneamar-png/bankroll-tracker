<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Bankroll Tracker · Générique</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>*{box-sizing:border-box;margin:0;padding:0}body{background:#07070f;color:#e2ddd4;font-family:Georgia,serif}input::-webkit-inner-spin-button{-webkit-appearance:none}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;

function fmt(n) {
  if (n === null || n === undefined || isNaN(n)) return "—";
  return n.toFixed(2).replace(".", ",");
}

function requiredOdds(bankroll, target, daysLeft) {
  if (daysLeft <= 0 || bankroll <= 0 || target <= bankroll) return null;
  return Math.pow(target / bankroll, 1 / daysLeft);
}

function generateCombos(target, n) {
  const base = Math.pow(target, 1 / n);
  const offsets = [-0.12, -0.08, -0.05, -0.02, 0, 0.02, 0.05, 0.08, 0.12];
  const results = [];
  if (n === 2) {
    offsets.forEach(d => {
      const a = Math.max(1.05, base + d), b = target / a;
      if (b >= 1.05 && Math.abs(a - b) < 0.5) results.push([a, b].sort((x, y) => x - y));
    });
  } else if (n === 3) {
    offsets.forEach(d1 => offsets.forEach(d2 => {
      const a = Math.max(1.05, base + d1), b = Math.max(1.05, base + d2), c = target / (a * b);
      if (c >= 1.05 && c <= 3.0) results.push([a, b, c].sort((x, y) => x - y));
    }));
  } else if (n === 4) {
    offsets.forEach(d1 => offsets.forEach(d2 => {
      const a = Math.max(1.05, base + d1), b = Math.max(1.05, base + d2), c = Math.max(1.05, base), d = target / (a * b * c);
      if (d >= 1.05 && d <= 2.5) results.push([a, b, c, d].sort((x, y) => x - y));
    }));
  }
  const seen = new Set();
  return results.filter(combo => {
    const key = combo.map(x => x.toFixed(2)).join("-");
    if (seen.has(key)) return false;
    seen.add(key); return true;
  }).sort((a, b) => {
    const sd = arr => Math.sqrt(arr.reduce((s, x) => s + Math.pow(x - base, 2), 0) / arr.length);
    return sd(a) - sd(b);
  }).slice(0, 3);
}

function ComboSuggestions({ targetOdds }) {
  if (!targetOdds || targetOdds <= 1.05) return null;
  const tag = { display: "inline-block", background: "#161628", border: "1px solid #2a2a3e", borderRadius: 4, padding: "3px 8px", fontSize: 12, color: "#c4a96e", margin: "0 3px" };
  const renderCombo = (combo, i) => (
    <div key={i} style={{ display: "flex", alignItems: "center", gap: 4, marginBottom: 6, flexWrap: "wrap" }}>
      {combo.map((c, j) => (
        <span key={j} style={{ display: "flex", alignItems: "center", gap: 4 }}>
          <span style={tag}>×{fmt(c)}</span>
          {j < combo.length - 1 && <span style={{ color: "#3a3a52", fontSize: 11 }}>×</span>}
        </span>
      ))}
      <span style={{ color: "#3a3a52", fontSize: 11, marginLeft: 4 }}>= <span style={{ color: "#7a7a92" }}>×{fmt(combo.reduce((p, x) => p * x, 1))}</span></span>
    </div>
  );
  return (
    <div style={{ background: "#090914", border: "1px solid #1a1a2e", borderRadius: 6, padding: 16, marginTop: 12 }}>
      <div style={{ fontSize: 9, letterSpacing: "0.2em", textTransform: "uppercase", color: "#4a4a62", marginBottom: 14 }}>Décompositions pour ×{fmt(targetOdds)}</div>
      {[{ label: "2 matchs", n: 2 }, { label: "3 matchs", n: 3 }, { label: "4 matchs", n: 4 }].map(({ label, n }) => (
        <div key={n} style={{ marginBottom: 14 }}>
          <div style={{ fontSize: 10, color: "#555570", marginBottom: 6 }}>{label}</div>
          {generateCombos(targetOdds, n).map(renderCombo)}
        </div>
      ))}
      <div style={{ fontSize: 10, color: "#3a3a52", marginTop: 8, borderTop: "1px solid #1a1a2e", paddingTop: 8 }}>Guide — va chercher ces cotes sur ton bookmaker.</div>
    </div>
  );
}

function Setup({ onStart }) {
  const [mise, setMise] = useState("20");
  const [obj, setObj] = useState("2000");
  const [jours, setJours] = useState("30");
  const m = parseFloat(mise), o = parseFloat(obj), j = parseInt(jours);
  const err = isNaN(m) || m <= 0 || isNaN(o) || o <= m || isNaN(j) || j < 2;
  const inp = { width: "100%", background: "#0e0e1e", border: "1px solid #2a2a3e", borderRadius: 6, color: "#e2ddd4", padding: "13px 16px", fontSize: 20, outline: "none", boxSizing: "border-box" };
  return (
    <div style={{ minHeight: "100vh", background: "#07070f", display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }}>
      <div style={{ width: "100%", maxWidth: 400 }}>
        <div style={{ fontSize: 10, letterSpacing: "0.3em", color: "#555570", textTransform: "uppercase", marginBottom: 8 }}>Bankroll Tracker</div>
        <h1 style={{ fontSize: 26, fontWeight: "normal", color: "#f0ead8", margin: "0 0 6px" }}>Version Générique</h1>
        <p style={{ fontSize: 13, color: "#4a4a62", margin: "0 0 28px" }}>Définis tes paramètres.</p>
        {[
          { label: "Mise de départ (€)", val: mise, set: setMise },
          { label: "Objectif final (€)", val: obj, set: setObj },
          { label: "Nombre de jours", val: jours, set: setJours },
        ].map(({ label, val, set }) => (
          <div key={label} style={{ marginBottom: 16 }}>
            <label style={{ fontSize: 11, color: "#555570", display: "block", marginBottom: 7, letterSpacing: "0.1em", textTransform: "uppercase" }}>{label}</label>
            <input type="number" value={val} onChange={e => set(e.target.value)} style={inp} />
          </div>
        ))}
        {!err && (
          <div style={{ marginBottom: 20, padding: "14px 16px", background: "#0e0e1e", borderRadius: 6, border: "1px solid #1e1e2e" }}>
            <div style={{ fontSize: 12, color: "#555570", marginBottom: 4 }}>Cote journalière initiale</div>
            <div style={{ fontSize: 22, color: "#c4a96e" }}>×{fmt(requiredOdds(m, o, j))}</div>
            <div style={{ fontSize: 11, color: "#3a3a52", marginTop: 4 }}>sur {j} jours · recalculée chaque jour</div>
          </div>
        )}
        <button disabled={err} onClick={() => onStart(m, o, j)}
          style={{ width: "100%", background: err ? "#1a1a2a" : "#c4a96e", border: "none", borderRadius: 6, color: err ? "#3a3a4a" : "#07070f", padding: 15, fontSize: 14, fontWeight: "bold", cursor: err ? "default" : "pointer", letterSpacing: "0.08em", textTransform: "uppercase" }}>
          Démarrer
        </button>
      </div>
    </div>
  );
}

function App() {
  const [config, setConfig] = useState(() => { try { return JSON.parse(localStorage.getItem("gen_config") || "null"); } catch { return null; } });
  const [entries, setEntries] = useState(() => { try { return JSON.parse(localStorage.getItem("gen_entries") || "{}"); } catch { return {}; } });
  const [inputs, setInputs] = useState({});
  const [activeDay, setActiveDay] = useState(null);
  const [showCombo, setShowCombo] = useState({});

  const saveConfig = (c) => { setConfig(c); try { localStorage.setItem("gen_config", JSON.stringify(c)); } catch {} };
  const saveEntries = (e) => { setEntries(e); try { localStorage.setItem("gen_entries", JSON.stringify(e)); } catch {} };

  const handleReset = () => {
    saveConfig(null);
    saveEntries({});
    setInputs({});
    setActiveDay(null);
  };

  if (!config) return <Setup onStart={(m, o, j) => saveConfig({ mise: m, objectif: o, jours: j })} />;

  const { mise: INITIAL, objectif: TARGET, jours: DAYS } = config;

  function getBankroll(upToDay) {
    let bk = INITIAL;
    for (let i = 1; i <= upToDay; i++) {
      const e = entries[i];
      if (e && e.odds && e.won !== null) {
        const o = parseFloat(String(e.odds).replace(",", "."));
        bk = e.won ? bk * o : 0;
      }
    }
    return bk;
  }

  const lastPlayedDay = Object.keys(entries).filter(d => entries[d]?.won !== null && entries[d]?.odds).map(Number).sort((a, b) => b - a)[0] || 0;
  const currentBankroll = getBankroll(lastPlayedDay);
  const progressPct = Math.min(100, Math.max(0, ((currentBankroll - INITIAL) / (TARGET - INITIAL)) * 100));
  const daysRemaining = DAYS - lastPlayedDay;
  const currentReqOdds = requiredOdds(currentBankroll, TARGET, daysRemaining);
  const reqColor = (r) => !r ? "#3a3a52" : r < 1.3 ? "#6aaa6a" : r < 1.6 ? "#c4a96e" : r < 2.0 ? "#c4844a" : "#aa6a6a";

  function handleSave(day) {
    const oddsRaw = inputs[`${day}_odds`] ?? entries[day]?.odds ?? "";
    const won = inputs[`${day}_won`] !== undefined ? inputs[`${day}_won`] : entries[day]?.won ?? null;
    const odds = parseFloat(String(oddsRaw).replace(",", "."));
    if (isNaN(odds) || odds <= 1 || won === null) return;
    const next = { ...entries, [day]: { odds: oddsRaw, won } };
    saveEntries(next);
    setActiveDay(null);
    setInputs(prev => { const n = { ...prev }; delete n[`${day}_odds`]; delete n[`${day}_won`]; return n; });
  }

  function handleResetDay(day) {
    const next = { ...entries }; delete next[day]; saveEntries(next);
  }

  return (
    <div style={{ minHeight: "100vh", background: "#07070f", color: "#e2ddd4", fontFamily: "Georgia,serif" }}>
      <div style={{ background: "linear-gradient(180deg,#0e0e1c,#07070f)", borderBottom: "1px solid #1c1c2e", padding: "20px 16px 16px" }}>
        <div style={{ maxWidth: 700, margin: "0 auto" }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", flexWrap: "wrap", gap: 8 }}>
            <div>
              <div style={{ fontSize: 9, letterSpacing: "0.3em", color: "#555570", textTransform: "uppercase", marginBottom: 3 }}>Bankroll Tracker · Générique</div>
              <h1 style={{ fontSize: 20, fontWeight: "normal", margin: 0, color: "#f0ead8" }}>{DAYS} jours</h1>
            </div>
            <div style={{ textAlign: "right" }}>
              <div style={{ fontSize: 11, color: "#555570" }}>{fmt(INITIAL)} € → <span style={{ color: "#c4a96e" }}>{fmt(TARGET)} €</span></div>
              <button onClick={handleReset} style={{ marginTop: 4, fontSize: 10, color: "#aa6a6a", background: "none", border: "1px solid #3a2a2a", borderRadius: 4, padding: "3px 8px", cursor: "pointer" }}>Effacer et recommencer</button>
            </div>
          </div>
          <div style={{ marginTop: 14 }}>
            <div style={{ display: "flex", justifyContent: "space-between", fontSize: 11, color: "#555570", marginBottom: 4 }}>
              <span>Bankroll : <strong style={{ color: "#c4a96e" }}>{fmt(currentBankroll)} €</strong></span>
              <span>Cote requise : <strong style={{ color: reqColor(currentReqOdds) }}>×{fmt(currentReqOdds)}</strong></span>
            </div>
            <div style={{ height: 3, background: "#161626", borderRadius: 2, overflow: "hidden" }}>
              <div style={{ height: "100%", width: `${progressPct}%`, background: "linear-gradient(90deg,#7a6030,#c4a96e)", transition: "width 0.5s" }} />
            </div>
          </div>
        </div>
      </div>

      <div style={{ maxWidth: 700, margin: "0 auto", padding: "12px 8px 40px" }}>
        <div style={{ display: "grid", gridTemplateColumns: "44px 1fr 90px 100px", padding: "6px 10px", fontSize: 9, letterSpacing: "0.14em", color: "#2e2e46", textTransform: "uppercase", borderBottom: "1px solid #111120" }}>
          <div>Jour</div><div style={{ paddingLeft: 6 }}>Bankroll · Cote requise</div>
          <div style={{ textAlign: "right" }}>Jouée</div>
          <div style={{ textAlign: "right" }}>Résultat</div>
        </div>

        {Array.from({ length: DAYS }, (_, i) => i + 1).map((day, idx) => {
          const entry = entries[day];
          const isActive = activeDay === day;
          const isPast = !!(entry?.won !== null && entry?.odds);
          const isCurrent = day === lastPlayedDay + 1;
          const isFuture = day > lastPlayedDay + 1;
          const won = entry?.won;
          const bankrollStart = getBankroll(day - 1);
          const dLeft = DAYS - day + 1;
          const reqOdds = requiredOdds(bankrollStart, TARGET, dLeft);
          const playedOdds = entry ? parseFloat(String(entry.odds).replace(",", ".")) : null;
          const realEnd = isPast ? (won ? bankrollStart * playedOdds : 0) : null;
          const rowBg = isCurrent ? "#0e0e20" : idx % 2 === 0 ? "#0b0b18" : "#07070f";

          return (
            <div key={day} style={{ opacity: isFuture ? 0.35 : 1 }}>
              <div onClick={() => !isFuture && setActiveDay(isActive ? null : day)}
                style={{ display: "grid", gridTemplateColumns: "44px 1fr 90px 100px", padding: "12px 10px", background: isActive ? "#101022" : rowBg, borderBottom: `1px solid ${isCurrent ? "#2a2a4a" : "#111120"}`, cursor: isFuture ? "default" : "pointer", alignItems: "center", borderLeft: isCurrent ? "2px solid #c4a96e" : "2px solid transparent" }}>
                <div style={{ fontSize: 12, color: isPast ? (won ? "#6aaa6a" : "#aa6a6a") : isCurrent ? "#c4a96e" : "#6a6a7a" }}>
                  J{day}{isPast && <span style={{ fontSize: 8, marginLeft: 1 }}>{won ? "✓" : "✗"}</span>}
                </div>
                <div style={{ paddingLeft: 6 }}>
                  <span style={{ fontSize: 12, color: "#7a7a92" }}>{fmt(bankrollStart)} €</span>
                  {reqOdds && <span style={{ marginLeft: 8, fontSize: 12, color: reqColor(reqOdds), fontWeight: "bold" }}>→ ×{fmt(reqOdds)}</span>}
                </div>
                <div style={{ textAlign: "right", fontSize: 11, color: "#7a7a92" }}>
                  {isPast ? `×${fmt(playedOdds)}` : isCurrent ? <span style={{ color: "#c4a96e", fontSize: 10 }}>← saisir</span> : "—"}
                </div>
                <div style={{ textAlign: "right" }}>
                  {isPast ? <span style={{ fontSize: 12, color: won ? "#6aaa6a" : "#aa6a6a", fontWeight: "bold" }}>{fmt(realEnd)} €</span> : <span style={{ color: "#2a2a3a" }}>—</span>}
                </div>
              </div>

              {isActive && (
                <div style={{ background: "#0d0d1e", borderBottom: "1px solid #2a2a3e", padding: "14px 10px" }}>
                  <div style={{ fontSize: 9, color: "#4a4a62", letterSpacing: "0.12em", textTransform: "uppercase", marginBottom: 10 }}>
                    Jour {day} · {fmt(bankrollStart)} € · Cote requise : ×{fmt(reqOdds)}
                  </div>
                  <div style={{ marginBottom: 12 }}>
                    <button onClick={() => setShowCombo(prev => ({ ...prev, [day]: !prev[day] }))}
                      style={{ background: showCombo[day] ? "#1e1e3a" : "#141428", border: "1px solid #2a2a4a", borderRadius: 4, color: "#7a7aaa", padding: "6px 12px", fontSize: 11, cursor: "pointer" }}>
                      {showCombo[day] ? "▲ Masquer combinaisons" : "▼ Voir combinaisons suggérées"}
                    </button>
                    {showCombo[day] && <ComboSuggestions targetOdds={reqOdds} />}
                  </div>
                  <div style={{ display: "flex", gap: 8, alignItems: "flex-end", flexWrap: "wrap" }}>
                    <div>
                      <label style={{ fontSize: 10, color: "#4a4a62", display: "block", marginBottom: 4 }}>Cote jouée</label>
                      <input type="number" step="0.01" min="1.01" placeholder={fmt(reqOdds)} defaultValue={entry?.odds ?? ""}
                        onChange={e => setInputs(p => ({ ...p, [`${day}_odds`]: e.target.value }))}
                        style={{ background: "#161628", border: "1px solid #2a2a3e", borderRadius: 4, color: "#e2ddd4", padding: "8px 10px", fontSize: 15, width: 100, outline: "none" }} />
                    </div>
                    <div>
                      <label style={{ fontSize: 10, color: "#4a4a62", display: "block", marginBottom: 4 }}>Résultat</label>
                      <div style={{ display: "flex", gap: 6 }}>
                        {[{ label: "Gagné ✓", val: true, bg: "#1a3a1a", abg: "#2a5a2a", col: "#6aaa6a" }, { label: "Perdu ✗", val: false, bg: "#3a1a1a", abg: "#5a2a2a", col: "#aa6a6a" }].map(opt => {
                          const cur = inputs[`${day}_won`] !== undefined ? inputs[`${day}_won`] : entry?.won ?? null;
                          const sel = cur === opt.val;
                          return <button key={String(opt.val)} onClick={() => setInputs(p => ({ ...p, [`${day}_won`]: opt.val }))}
                            style={{ background: sel ? opt.abg : opt.bg, border: `1px solid ${sel ? opt.col : "#2a2a3e"}`, borderRadius: 4, color: sel ? opt.col : "#4a4a62", padding: "8px 12px", fontSize: 11, cursor: "pointer" }}>{opt.label}</button>;
                        })}
                      </div>
                    </div>
                    <div style={{ display: "flex", gap: 6 }}>
                      <button onClick={() => handleSave(day)} style={{ background: "#c4a96e", border: "none", borderRadius: 4, color: "#07070f", padding: "8px 16px", fontSize: 12, fontWeight: "bold", cursor: "pointer" }}>Valider</button>
                      {entry && <button onClick={() => handleResetDay(day)} style={{ background: "transparent", border: "1px solid #2a2a3e", borderRadius: 4, color: "#4a4a62", padding: "8px 10px", fontSize: 11, cursor: "pointer" }}>Reset</button>}
                    </div>
                  </div>
                  {(() => {
                    const o = parseFloat(String(inputs[`${day}_odds`] ?? "").replace(",", "."));
                    const w = inputs[`${day}_won`];
                    if (!isNaN(o) && o > 1 && w !== undefined) {
                      const res = w ? bankrollStart * o : 0;
                      const dAfter = DAYS - day;
                      const newReq = requiredOdds(res, TARGET, dAfter);
                      return <div style={{ marginTop: 10, fontSize: 11, color: "#6a6a82" }}>
                        Après : <strong style={{ color: w ? "#6aaa6a" : "#aa6a6a" }}>{fmt(res)} €</strong>
                        {newReq && dAfter > 0 && <span style={{ marginLeft: 10, color: "#4a4a62" }}>→ cote j+1 : <strong style={{ color: reqColor(newReq) }}>×{fmt(newReq)}</strong></span>}
                      </div>;
                    }
                    return null;
                  })()}
                </div>
              )}
            </div>
          );
        })}

        <div style={{ marginTop: 20, display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 8, padding: 16, background: "#0b0b18", border: "1px solid #161626", borderRadius: 6 }}>
          {[
            { label: "Bankroll", value: `${fmt(currentBankroll)} €`, color: "#c4a96e" },
            { label: `Cote · ${daysRemaining}j`, value: currentReqOdds ? `×${fmt(currentReqOdds)}` : "🎯", color: reqColor(currentReqOdds) },
            { label: "Objectif", value: `${fmt(TARGET)} €`, color: "#3a3a52" },
          ].map((r, i) => (
            <div key={i} style={{ textAlign: "center" }}>
              <div style={{ fontSize: 9, letterSpacing: "0.1em", textTransform: "uppercase", color: "#3a3a52", marginBottom: 4 }}>{r.label}</div>
              <div style={{ fontSize: 16, color: r.color }}>{r.value}</div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
