function fmt(n) {
  if (n === null || n === undefined || isNaN(n)) return "—";
  return n.toFixed(2).replace(".", ",");
}

function requiredOdds(bankroll, target, daysLeft) {
  if (daysLeft <= 0 || bankroll <= 0 || target <= bankroll) return null;
  return Math.pow(target / bankroll, 1 / daysLeft);
}

function generateCombos(target, n) {

      if (c >= 1.05 && c <= 3.0) results.push([a, b, c].sort((x, y) => x - y));
    }));
  } else if (n === 4) {
    offsets.forEach(d1 => offsets.forEach(d2 => {

    }));
  }

    const key = combo.map(x => x.toFixed(2)).join("-");

  }).slice(0, 3);
}
